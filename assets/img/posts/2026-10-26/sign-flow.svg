<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <style>
    .h { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .t { font-size: 14.5px; font-weight: 700; fill: #1f3a5f; }
    .s { font-size: 12.5px; fill: #44546a; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #1f3a5f; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a78b5"/>
    </marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b26a00"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" rx="12" fill="#ffffff"/>

  <!-- column panels -->
  <rect x="20" y="20" width="200" height="330" rx="10" fill="#f5f8fc" stroke="#c5d2e3"/>
  <rect x="20" y="20" width="200" height="38" rx="10" fill="#4a78b5"/>
  <text x="120" y="45" class="h" text-anchor="middle">송신 단말 (SDEE)</text>

  <rect x="250" y="20" width="420" height="330" rx="10" fill="#f5f8fc" stroke="#c5d2e3"/>
  <rect x="250" y="20" width="420" height="38" rx="10" fill="#1f3a5f"/>
  <text x="460" y="45" class="h" text-anchor="middle">SDS — SignedData 생성</text>

  <rect x="700" y="20" width="180" height="330" rx="10" fill="#f5f8fc" stroke="#c5d2e3"/>
  <rect x="700" y="20" width="180" height="38" rx="10" fill="#4a78b5"/>
  <text x="790" y="45" class="h" text-anchor="middle">출력 SPDU</text>

  <!-- inputs -->
  <rect x="36" y="78" width="168" height="62" rx="8" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="50" y="104" class="t">Application PDU</text>
  <text x="50" y="126" class="s">전송할 데이터</text>

  <rect x="36" y="170" width="168" height="62" rx="8" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="50" y="196" class="t">Signing Certificate</text>
  <text x="50" y="218" class="s">서명자 권한 · 공개키</text>

  <rect x="36" y="262" width="168" height="72" rx="8" fill="#fff4e0" stroke="#b26a00" stroke-width="1.5"/>
  <text x="50" y="288" class="t" style="fill:#b26a00">Private Key (CMH)</text>
  <text x="50" y="308" class="s">HSM 안에 보관</text>
  <text x="50" y="325" class="s">SPDU에 포함되지 않음</text>

  <!-- SDS -->
  <rect x="270" y="78" width="180" height="62" rx="8" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="284" y="104" class="t">payload</text>
  <text x="284" y="126" class="s">Ieee1609Dot2Data</text>

  <rect x="470" y="78" width="180" height="62" rx="8" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="484" y="104" class="t">headerInfo</text>
  <text x="484" y="126" class="s">psid · generationTime</text>

  <rect x="320" y="162" width="280" height="50" rx="8" fill="#e8f0fb" stroke="#4a78b5" stroke-width="1.5"/>
  <text x="460" y="184" class="t" text-anchor="middle">ToBeSignedData</text>
  <text x="460" y="202" class="s" text-anchor="middle">정규화 → COER 인코딩</text>

  <rect x="290" y="232" width="340" height="40" rx="8" fill="#ffffff" stroke="#4a78b5" stroke-width="1.5"/>
  <text x="460" y="257" class="m" text-anchor="middle">H( H(tbsData) ‖ H(서명 인증서) )</text>

  <rect x="330" y="292" width="260" height="42" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="460" y="318" class="t" text-anchor="middle" style="fill:#2e7d4f">개인키로 ECDSA 서명</text>

  <!-- outputs -->
  <rect x="716" y="78" width="148" height="40" rx="8" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="790" y="103" class="t" text-anchor="middle">hashId</text>
  <rect x="716" y="128" width="148" height="40" rx="8" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="790" y="153" class="t" text-anchor="middle">tbsData</text>
  <rect x="716" y="178" width="148" height="40" rx="8" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="790" y="203" class="t" text-anchor="middle">signer</text>
  <rect x="716" y="228" width="148" height="40" rx="8" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="790" y="253" class="t" text-anchor="middle" style="fill:#2e7d4f">signature</text>

  <!-- arrows -->
  <line x1="204" y1="109" x2="268" y2="109" stroke="#4a78b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="360" y1="140" x2="400" y2="160" stroke="#4a78b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="140" x2="520" y2="160" stroke="#4a78b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="212" x2="460" y2="230" stroke="#4a78b5" stroke-width="2" marker-end="url(#a)"/>
  <line x1="460" y1="272" x2="460" y2="290" stroke="#4a78b5" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="204,201 236,201 236,252 288,252" fill="none" stroke="#4a78b5" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="204,298 236,298 236,313 328,313" fill="none" stroke="#b26a00" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#k)"/>
  <polyline points="600,187 684,187 684,148 714,148" fill="none" stroke="#4a78b5" stroke-width="2" marker-end="url(#a)"/>
  <polyline points="590,313 692,313 692,248 714,248" fill="none" stroke="#2e7d4f" stroke-width="2" marker-end="url(#a)"/>

  <!-- note -->
  <rect x="150" y="368" width="600" height="36" rx="8" fill="#e8f0fb"/>
  <text x="450" y="391" class="t" text-anchor="middle" style="font-size:14px">서명값(signature)은 포함되지만, 서명에 쓴 개인키는 SPDU에 포함되지 않는다</text>
</svg>
