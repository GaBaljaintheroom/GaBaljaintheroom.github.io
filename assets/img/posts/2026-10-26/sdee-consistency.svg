<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <style>
    .h { font-size: 17px; font-weight: 700; fill: #ffffff; }
    .t { font-size: 14.5px; font-weight: 700; fill: #1f3a5f; }
    .s { font-size: 12.5px; fill: #44546a; }
    .n { font-size: 12px; fill: #6b7c93; }
  </style>
  <rect x="0" y="0" width="900" height="360" rx="12" fill="#ffffff"/>

  <!-- SDS -->
  <rect x="20" y="20" width="340" height="320" rx="12" fill="#f5f8fc" stroke="#c5d2e3"/>
  <rect x="20" y="20" width="340" height="44" rx="12" fill="#1f3a5f"/>
  <text x="40" y="49" class="h">SDS가 검사할 수 있는 조건</text>

  <rect x="36" y="80" width="308" height="62" rx="8" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="50" y="105" class="t">PSID 문맥 일치</text>
  <text x="50" y="127" class="s">SPDU의 PSID = SDEE가 아는 PSID</text>

  <rect x="36" y="154" width="308" height="62" rx="8" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="50" y="179" class="t">체인 인증서 수</text>
  <text x="50" y="201" class="s">전체 체인의 인증서 수 &lt; SDEE 한도</text>

  <text x="40" y="256" class="n">SDS가 아는 것</text>
  <text x="40" y="278" class="s">· 보안 봉투 (headerInfo, signer)</text>
  <text x="40" y="298" class="s">· 인증서 체인</text>
  <text x="40" y="318" class="s">· SDEE가 요청에 넘긴 값 (PSID, 한도)</text>

  <!-- SDEE -->
  <rect x="380" y="20" width="500" height="320" rx="12" fill="#f3f9f5" stroke="#b7d9c2"/>
  <rect x="380" y="20" width="500" height="44" rx="12" fill="#2e7d4f"/>
  <text x="400" y="49" class="h">SDEE가 직접 검사하는 조건</text>

  <rect x="396" y="80" width="230" height="62" rx="8" fill="#ffffff" stroke="#9cc9ab"/>
  <text x="410" y="105" class="t">payload ↔ 인증서 권한</text>
  <text x="410" y="127" class="s">PSID · SSP · assurance level</text>

  <rect x="636" y="80" width="230" height="62" rx="8" fill="#ffffff" stroke="#9cc9ab"/>
  <text x="650" y="105" class="t">외부 데이터 해시</text>
  <text x="650" y="127" class="s">extDataHash가 올바른가</text>

  <rect x="396" y="154" width="230" height="62" rx="8" fill="#ffffff" stroke="#9cc9ab"/>
  <text x="410" y="179" class="t">지리 영역</text>
  <text x="410" y="201" class="s">영역이 인증서 region 안인가</text>

  <rect x="636" y="154" width="230" height="62" rx="8" fill="#ffffff" stroke="#9cc9ab"/>
  <text x="650" y="179" class="t">appExtensions</text>
  <text x="650" y="201" class="s">명세가 요구하면 payload와 정합</text>

  <text x="400" y="256" class="n">SDEE만 아는 것</text>
  <text x="400" y="278" class="s">· payload의 의미 (메시지 필드 구조)</text>
  <text x="400" y="298" class="s">· SSP 비트가 뜻하는 권한</text>
  <text x="400" y="318" class="s">· SPDU 밖으로 전달된 외부 데이터, payload 안의 영역 정보</text>
</svg>
