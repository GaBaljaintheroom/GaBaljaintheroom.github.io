<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <style>
    .t { font-size: 15px; font-weight: 700; fill: #1f3a5f; }
    .s { font-size: 13px; fill: #44546a; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 12.5px; fill: #44546a; }
  </style>
  <rect x="0" y="0" width="720" height="460" rx="12" fill="#ffffff"/>

  <!-- Ieee1609Dot2Data -->
  <rect x="20" y="20" width="680" height="420" rx="10" fill="#f5f8fc" stroke="#9fb3cc"/>
  <text x="40" y="48" class="t">Ieee1609Dot2Data</text>
  <text x="200" y="48" class="m">protocolVersion = 3</text>

  <!-- signedData -->
  <rect x="40" y="66" width="640" height="356" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
  <text x="60" y="92" class="t">content : signedData</text>

  <!-- hashId -->
  <rect x="60" y="108" width="600" height="36" rx="6" fill="#ffffff" stroke="#c5d2e3"/>
  <text x="76" y="131" class="t" style="font-size:14px">hashId</text>
  <text x="160" y="131" class="s">해시 알고리즘 (예: SHA-256)</text>

  <!-- tbsData -->
  <rect x="60" y="156" width="600" height="160" rx="6" fill="#e8f0fb" stroke="#4a78b5" stroke-width="1.5"/>
  <text x="76" y="180" class="t" style="font-size:14px">tbsData</text>
  <text x="160" y="180" class="s">ToBeSignedData — 서명 대상</text>

  <rect x="76" y="194" width="276" height="108" rx="6" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="92" y="218" class="t" style="font-size:14px">payload</text>
  <text x="92" y="242" class="m">data = Ieee1609Dot2Data</text>
  <text x="92" y="262" class="m">  └ unsecuredData</text>
  <text x="92" y="286" class="s">실제 전송 데이터 (예: BSM)</text>

  <rect x="368" y="194" width="276" height="108" rx="6" fill="#ffffff" stroke="#9fb3cc"/>
  <text x="384" y="218" class="t" style="font-size:14px">headerInfo</text>
  <text x="384" y="242" class="m">psid · generationTime</text>
  <text x="384" y="262" class="m">expiryTime · generationLocation</text>
  <text x="384" y="286" class="s">SDS가 덧붙이는 보안 정보</text>

  <!-- signer -->
  <rect x="60" y="328" width="600" height="36" rx="6" fill="#ffffff" stroke="#c5d2e3"/>
  <text x="76" y="351" class="t" style="font-size:14px">signer</text>
  <text x="160" y="351" class="s">digest (HashedId8) / certificate / self</text>

  <!-- signature -->
  <rect x="60" y="374" width="600" height="36" rx="6" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="76" y="397" class="t" style="font-size:14px; fill:#2e7d4f">signature</text>
  <text x="160" y="397" class="s">ECDSA 서명값 — tbsData와 서명 인증서에 대한 서명</text>
</svg>
