<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1218" width="960" font-family="sans-serif">
<defs><marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#424242"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="480.0" y="40" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">Butterfly Key 발급 순서 (차량 · RA · PCA)</text>
<rect x="5.0" y="70" width="310" height="1022" rx="12" fill="#e3f2fd" opacity="0.35"/>
<rect x="15.0" y="76" width="290" height="34" rx="17" fill="#1565c0"/>
<text x="160" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">차량 (End Entity)</text>
<rect x="325.0" y="70" width="310" height="1022" rx="12" fill="#fff3e0" opacity="0.35"/>
<rect x="335.0" y="76" width="290" height="34" rx="17" fill="#ef6c00"/>
<text x="480" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">RA (등록 기관)</text>
<rect x="645.0" y="70" width="310" height="1022" rx="12" fill="#e8f5e9" opacity="0.35"/>
<rect x="655.0" y="76" width="290" height="34" rx="17" fill="#2e7d32"/>
<text x="800" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">PCA / ACA (인증서 발급)</text>
<rect x="15.0" y="120" width="290" height="99" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="160" y="144" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Caterpillar 키 생성</text>
<text x="160" y="166" text-anchor="middle" font-size="13" fill="#1565c0" font-family="Menlo, Consolas, monospace">a, A = a·G   (서명용)</text>
<text x="160" y="185" text-anchor="middle" font-size="13" fill="#1565c0" font-family="Menlo, Consolas, monospace">p, P = p·G   (암호화용)</text>
<text x="160" y="204" text-anchor="middle" font-size="13" fill="#1565c0" font-family="Menlo, Consolas, monospace">확장키 ck, ek</text>
<line x1="190" y1="255" x2="450" y2="255" stroke="#424242" stroke-width="2.5" marker-end="url(#k)"/>
<text x="320.0" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#424242" paint-order="stroke" stroke="#fff" stroke-width="5">① 요청 1번 : A, P, ck, ek</text>
<rect x="335.0" y="277" width="290" height="80" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="480" y="301" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Cocoon 키 확장 (n개)</text>
<text x="480" y="323" text-anchor="middle" font-size="13" fill="#ef6c00" font-family="Menlo, Consolas, monospace">B_i = A + f1(ck, i)·G</text>
<text x="480" y="342" text-anchor="middle" font-size="13" fill="#ef6c00" font-family="Menlo, Consolas, monospace">Q_i = P + f2(ek, i)·G</text>
<rect x="335.0" y="371" width="290" height="80" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="480" y="395" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">여러 차량의 요청을 섞기</text>
<text x="480" y="417" text-anchor="middle" font-size="13" fill="#ef6c00" font-family="Menlo, Consolas, monospace">shuffle</text>
<text x="480" y="436" text-anchor="middle" font-size="13" fill="#ef6c00" font-family="Menlo, Consolas, monospace">→ 어느 요청이 누구 것인지 숨김</text>
<line x1="510" y1="487" x2="770" y2="487" stroke="#424242" stroke-width="2.5" marker-end="url(#k)"/>
<text x="640.0" y="478" text-anchor="middle" font-size="14" font-weight="bold" fill="#424242" paint-order="stroke" stroke="#fff" stroke-width="5">② B_i, Q_i  (차량 정보 없음)</text>
<rect x="655.0" y="509" width="290" height="99" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="800" y="533" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Butterfly 공개키 + 인증서</text>
<text x="800" y="555" text-anchor="middle" font-size="13" fill="#2e7d32" font-family="Menlo, Consolas, monospace">랜덤 c_i 선택</text>
<text x="800" y="574" text-anchor="middle" font-size="13" fill="#2e7d32" font-family="Menlo, Consolas, monospace">U_i = B_i + c_i·G</text>
<text x="800" y="593" text-anchor="middle" font-size="13" fill="#2e7d32" font-family="Menlo, Consolas, monospace">U_i 로 익명 인증서 발급</text>
<rect x="655.0" y="622" width="290" height="80" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="800" y="646" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Cocoon Encryption</text>
<text x="800" y="668" text-anchor="middle" font-size="13" fill="#2e7d32" font-family="Menlo, Consolas, monospace">Enc_Q_i( 인증서, c_i )</text>
<text x="800" y="687" text-anchor="middle" font-size="13" fill="#2e7d32" font-family="Menlo, Consolas, monospace">→ 차량만 열 수 있게 암호화</text>
<line x1="770" y1="738" x2="510" y2="738" stroke="#424242" stroke-width="2.5" marker-end="url(#k)"/>
<text x="640.0" y="729" text-anchor="middle" font-size="14" font-weight="bold" fill="#424242" paint-order="stroke" stroke="#fff" stroke-width="5">③ 암호화된 응답</text>
<rect x="335.0" y="760" width="290" height="80" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="480" y="784" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">응답 전달만 수행</text>
<text x="480" y="806" text-anchor="middle" font-size="13" fill="#ef6c00" font-family="Menlo, Consolas, monospace">내용을 열어볼 수 없음</text>
<text x="480" y="825" text-anchor="middle" font-size="13" fill="#ef6c00" font-family="Menlo, Consolas, monospace">(Q_i의 개인키가 없음)</text>
<line x1="450" y1="876" x2="190" y2="876" stroke="#424242" stroke-width="2.5" marker-end="url(#k)"/>
<text x="320.0" y="867" text-anchor="middle" font-size="14" font-weight="bold" fill="#424242" paint-order="stroke" stroke="#fff" stroke-width="5">④ 암호화된 응답</text>
<rect x="15.0" y="898" width="290" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="160" y="922" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">복호화하여 c_i 획득</text>
<text x="160" y="944" text-anchor="middle" font-size="13" fill="#1565c0" font-family="Menlo, Consolas, monospace">q_i = p + f2(ek, i)</text>
<text x="160" y="963" text-anchor="middle" font-size="13" fill="#1565c0" font-family="Menlo, Consolas, monospace">Dec_q_i( 응답 ) → 인증서, c_i</text>
<rect x="15.0" y="992" width="290" height="80" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="160" y="1016" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Butterfly 개인키 계산·보관</text>
<text x="160" y="1038" text-anchor="middle" font-size="13" fill="#1565c0" font-family="Menlo, Consolas, monospace">u_i = a + f1(ck, i) + c_i</text>
<text x="160" y="1057" text-anchor="middle" font-size="13" fill="#1565c0" font-family="Menlo, Consolas, monospace">u_i·G == U_i 확인 후 보관</text>
<text x="480.0" y="1114" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">누가 무엇을 아는가 → 어느 한 기관도 "차량 ↔ 인증서"를 연결할 수 없음</text>
<rect x="15.0" y="1128" width="290" height="66" rx="10" fill="#fff" stroke="#1565c0" stroke-width="2" stroke-dasharray="6 4"/>
<text x="160" y="1154" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">자신의 신원 : 앎</text>
<text x="160" y="1176" text-anchor="middle" font-size="14" fill="#1565c0" font-weight="bold">인증서·개인키 : 앎</text>
<rect x="335.0" y="1128" width="290" height="66" rx="10" fill="#fff" stroke="#ef6c00" stroke-width="2" stroke-dasharray="6 4"/>
<text x="480" y="1154" text-anchor="middle" font-size="14" fill="#ef6c00" font-weight="bold">차량 신원 : 앎</text>
<text x="480" y="1176" text-anchor="middle" font-size="14" fill="#ef6c00" font-weight="bold">인증서 내용 : 모름</text>
<rect x="655.0" y="1128" width="290" height="66" rx="10" fill="#fff" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 4"/>
<text x="800" y="1154" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">차량 신원 : 모름</text>
<text x="800" y="1176" text-anchor="middle" font-size="14" fill="#2e7d32" font-weight="bold">인증서 내용 : 앎</text>
</svg>