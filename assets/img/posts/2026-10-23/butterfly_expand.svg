<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 600" width="940" font-family="sans-serif">
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker></defs><rect width="100%" height="100%" fill="#fff"/>
<text x="470.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">Butterfly Key : 키 1개 → 익명 인증서용 키 n개</text>
<text x="150" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#1565c0">Caterpillar Key</text>
<text x="150" y="98" text-anchor="middle" font-size="13" fill="#666">차량이 1번 생성</text>
<text x="470" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#ef6c00">Cocoon Key</text>
<text x="470" y="98" text-anchor="middle" font-size="13" fill="#666">RA가 n개로 확장</text>
<text x="790" y="78" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e7d32">Butterfly Key</text>
<text x="790" y="98" text-anchor="middle" font-size="13" fill="#666">PCA가 랜덤값 추가</text>
<rect x="40.0" y="265.0" width="220" height="70" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="150" y="292" text-anchor="middle" font-size="16" fill="#1565c0" font-family="Menlo, Consolas, monospace" font-weight="bold">A = a · G</text>
<text x="150" y="318" text-anchor="middle" font-size="12.5" fill="#555">공개키 1개 + 확장키 ck</text>
<path d="M260.0,300 C300,300 260,150 356.0,150" fill="none" stroke="#9e9e9e" stroke-width="2" marker-end="url(#g)"/>
<line x1="580.0" y1="150" x2="676.0" y2="150" stroke="#9e9e9e" stroke-width="2" marker-end="url(#g)"/>
<rect x="360.0" y="126" width="220" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="470" y="155" text-anchor="middle" font-size="14" fill="#ef6c00" font-family="Menlo, Consolas, monospace">B1 = A + f1(ck,1)·G</text>
<rect x="680.0" y="126" width="220" height="48" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="790" y="155" text-anchor="middle" font-size="14" fill="#2e7d32" font-family="Menlo, Consolas, monospace">U1 = B1 + c1·G</text>
<text x="630" y="142" text-anchor="middle" font-size="12" fill="#666">+ c1</text>
<path d="M260.0,300 C300,300 260,235 356.0,235" fill="none" stroke="#9e9e9e" stroke-width="2" marker-end="url(#g)"/>
<line x1="580.0" y1="235" x2="676.0" y2="235" stroke="#9e9e9e" stroke-width="2" marker-end="url(#g)"/>
<rect x="360.0" y="211" width="220" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="470" y="240" text-anchor="middle" font-size="14" fill="#ef6c00" font-family="Menlo, Consolas, monospace">B2 = A + f1(ck,2)·G</text>
<rect x="680.0" y="211" width="220" height="48" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="790" y="240" text-anchor="middle" font-size="14" fill="#2e7d32" font-family="Menlo, Consolas, monospace">U2 = B2 + c2·G</text>
<text x="630" y="227" text-anchor="middle" font-size="12" fill="#666">+ c2</text>
<path d="M260.0,300 C300,300 260,320 356.0,320" fill="none" stroke="#9e9e9e" stroke-width="2" marker-end="url(#g)"/>
<line x1="580.0" y1="320" x2="676.0" y2="320" stroke="#9e9e9e" stroke-width="2" marker-end="url(#g)"/>
<rect x="360.0" y="296" width="220" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="470" y="325" text-anchor="middle" font-size="14" fill="#ef6c00" font-family="Menlo, Consolas, monospace">B3 = A + f1(ck,3)·G</text>
<rect x="680.0" y="296" width="220" height="48" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="790" y="325" text-anchor="middle" font-size="14" fill="#2e7d32" font-family="Menlo, Consolas, monospace">U3 = B3 + c3·G</text>
<text x="630" y="312" text-anchor="middle" font-size="12" fill="#666">+ c3</text>
<text x="470" y="393" text-anchor="middle" font-size="26" fill="#9e9e9e">⋮</text>
<text x="790" y="393" text-anchor="middle" font-size="26" fill="#9e9e9e">⋮</text>
<path d="M260.0,300 C300,300 260,450 356.0,450" fill="none" stroke="#9e9e9e" stroke-width="2" marker-end="url(#g)"/>
<line x1="580.0" y1="450" x2="676.0" y2="450" stroke="#9e9e9e" stroke-width="2" marker-end="url(#g)"/>
<rect x="360.0" y="426" width="220" height="48" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
<text x="470" y="455" text-anchor="middle" font-size="14" fill="#ef6c00" font-family="Menlo, Consolas, monospace">Bn = A + f1(ck,n)·G</text>
<rect x="680.0" y="426" width="220" height="48" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="790" y="455" text-anchor="middle" font-size="14" fill="#2e7d32" font-family="Menlo, Consolas, monospace">Un = Bn + cn·G</text>
<text x="630" y="442" text-anchor="middle" font-size="12" fill="#666">+ cn</text>
<rect x="40" y="500" width="860" height="76" rx="10" fill="#fafafa" stroke="#bdbdbd" stroke-dasharray="6 4"/>
<text x="470.0" y="528" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">대응하는 개인키는 a, ck, c_i 를 모두 아는 차량만 계산 가능</text>
<text x="470.0" y="556" text-anchor="middle" font-size="15" fill="#1565c0" font-family="Menlo, Consolas, monospace">u_i = a + f1(ck, i) + c_i   →   u_i · G = U_i</text>
</svg>