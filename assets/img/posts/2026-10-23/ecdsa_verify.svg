<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 870" width="760" font-family="sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="380.0" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">ECDSA 서명 검증 (수신자)</text>
<text x="380.0" y="58" text-anchor="middle" font-size="14" fill="#666">개인키 없이, 힌트 s와 공개키 Q로 같은 점 R을 다시 만들어 본다</text>
<rect x="20" y="105.0" width="96" height="28" rx="14" fill="#37474f"/>
<text x="68.0" y="124.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">전송</text>
<rect x="130" y="80" width="600" height="78" rx="10" fill="#eceff1" stroke="#37474f" stroke-width="2"/>
<circle cx="160" cy="119.0" r="16" fill="#37474f"/>
<text x="160" y="125.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">1</text>
<text x="190" y="105" font-size="16" font-weight="bold" fill="#222">수신</text>
<text x="190" y="128" font-size="15" fill="#37474f" font-family="Menlo, Consolas, monospace">m,  서명 (r, s),  송신자 공개키 Q</text>
<text x="190" y="148" font-size="12.5" fill="#666">Q는 송신자 인증서에서 획득</text>
<line x1="430.0" y1="161" x2="430.0" y2="187" stroke="#9e9e9e" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="20" y="217.0" width="96" height="28" rx="14" fill="#c62828"/>
<text x="68.0" y="236.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">비교</text>
<rect x="130" y="192" width="600" height="78" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<circle cx="160" cy="231.0" r="16" fill="#c62828"/>
<text x="160" y="237.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">2</text>
<text x="190" y="217" font-size="16" font-weight="bold" fill="#222">서명 값 범위 확인</text>
<text x="190" y="240" font-size="15" fill="#c62828" font-family="Menlo, Consolas, monospace">1 ≤ r ≤ n−1,   1 ≤ s ≤ n−1</text>
<text x="190" y="260" font-size="12.5" fill="#666">범위를 벗어나면 즉시 거부</text>
<line x1="430.0" y1="273" x2="430.0" y2="299" stroke="#9e9e9e" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="20" y="329.0" width="96" height="28" rx="14" fill="#6a1b9a"/>
<text x="68.0" y="348.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">해시</text>
<rect x="130" y="304" width="600" height="78" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
<circle cx="160" cy="343.0" r="16" fill="#6a1b9a"/>
<text x="160" y="349.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">3</text>
<text x="190" y="329" font-size="16" font-weight="bold" fill="#222">메시지 해시</text>
<text x="190" y="352" font-size="15" fill="#6a1b9a" font-family="Menlo, Consolas, monospace">e = Hash(m)</text>
<text x="190" y="372" font-size="12.5" fill="#666">송신자와 같은 해시 함수 사용</text>
<line x1="430.0" y1="385" x2="430.0" y2="411" stroke="#9e9e9e" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="20" y="441.0" width="96" height="28" rx="14" fill="#00838f"/>
<text x="68.0" y="460.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">역원</text>
<rect x="130" y="416" width="600" height="78" rx="10" fill="#e0f7fa" stroke="#00838f" stroke-width="2"/>
<circle cx="160" cy="455.0" r="16" fill="#00838f"/>
<text x="160" y="461.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">4</text>
<text x="190" y="441" font-size="16" font-weight="bold" fill="#222">s의 역원 계산</text>
<text x="190" y="464" font-size="15" fill="#00838f" font-family="Menlo, Consolas, monospace">w = s^(-1) mod n</text>
<text x="190" y="484" font-size="12.5" fill="#666">s 안에 숨겨둔 k를 꺼내기 위한 준비</text>
<line x1="430.0" y1="497" x2="430.0" y2="523" stroke="#9e9e9e" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="20" y="553.0" width="96" height="28" rx="14" fill="#2e7d32"/>
<text x="68.0" y="572.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">서명값</text>
<rect x="130" y="528" width="600" height="78" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<circle cx="160" cy="567.0" r="16" fill="#2e7d32"/>
<text x="160" y="573.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">5</text>
<text x="190" y="553" font-size="16" font-weight="bold" fill="#222">계수 2개 계산</text>
<text x="190" y="576" font-size="15" fill="#2e7d32" font-family="Menlo, Consolas, monospace">u1 = e · w,   u2 = r · w   (mod n)</text>
<text x="190" y="596" font-size="12.5" fill="#666">u1 + u2 · d = k 가 되도록 설계되어 있음</text>
<line x1="430.0" y1="609" x2="430.0" y2="635" stroke="#9e9e9e" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="20" y="665.0" width="96" height="28" rx="14" fill="#1565c0"/>
<text x="68.0" y="684.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">점 연산</text>
<rect x="130" y="640" width="600" height="78" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<circle cx="160" cy="679.0" r="16" fill="#1565c0"/>
<text x="160" y="685.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">6</text>
<text x="190" y="665" font-size="16" font-weight="bold" fill="#222">점 R 다시 만들기</text>
<text x="190" y="688" font-size="15" fill="#1565c0" font-family="Menlo, Consolas, monospace">R&#x27; = u1 · G + u2 · Q</text>
<text x="190" y="708" font-size="12.5" fill="#666">= (u1 + u2 · d) · G = k · G = R  (d를 Q로 간접 사용)</text>
<line x1="430.0" y1="721" x2="430.0" y2="747" stroke="#9e9e9e" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="20" y="777.0" width="96" height="28" rx="14" fill="#c62828"/>
<text x="68.0" y="796.0" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">비교</text>
<rect x="130" y="752" width="600" height="78" rx="10" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
<circle cx="160" cy="791.0" r="16" fill="#c62828"/>
<text x="160" y="797.0" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">7</text>
<text x="190" y="777" font-size="16" font-weight="bold" fill="#222">x 좌표 비교</text>
<text x="190" y="800" font-size="15" fill="#c62828" font-family="Menlo, Consolas, monospace">(R&#x27;의 x 좌표) mod n  ==  r ?</text>
<text x="190" y="820" font-size="12.5" fill="#666">같으면 유효한 서명, 다르면 위조·변조 → 거부</text>
</svg>