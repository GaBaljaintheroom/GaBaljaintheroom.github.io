<svg xmlns="http://www.w3.org/2000/svg" width="900" height="396" viewBox="0 0 900 396"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker></defs><rect x="0" y="0" width="900" height="396" rx="14" fill="#ffffff" stroke="#e2e8f0"/><text x="24.0" y="34.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" fill="#0f172a" font-weight="bold" text-anchor="start">Butterfly 확장 함수 fS (9.3.3.1)</text><rect x="24.0" y="54.0" width="852.0" height="40.0" rx="8" fill="#475569" fill-opacity="0.1" stroke="#475569" stroke-width="1.6"/><text x="450.0" y="78.5" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">① 입력  ·  k : 확장 함수 키 (AES-128)   i, j : 32bit 정수   A : caterpillar 공개키</text><text x="24.0" y="126.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start">② 128bit 입력 블록 만들기</text><rect x="240.0" y="112.0" width="140.0" height="30.0" rx="4" fill="#475569" fill-opacity="0.14" stroke="#475569" stroke-width="1.4"/><text x="310.0" y="132.0" font-family="Menlo,Consolas,'D2Coding','Apple SD Gothic Neo',monospace" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">0^32</text><text x="310.0" y="158.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">xE 는 1^32</text><rect x="384.0" y="112.0" width="140.0" height="30.0" rx="4" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb" stroke-width="1.4"/><text x="454.0" y="132.0" font-family="Menlo,Consolas,'D2Coding','Apple SD Gothic Neo',monospace" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">i (32)</text><rect x="528.0" y="112.0" width="140.0" height="30.0" rx="4" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488" stroke-width="1.4"/><text x="598.0" y="132.0" font-family="Menlo,Consolas,'D2Coding','Apple SD Gothic Neo',monospace" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">j (32)</text><rect x="672.0" y="112.0" width="140.0" height="30.0" rx="4" fill="#475569" fill-opacity="0.14" stroke="#475569" stroke-width="1.4"/><text x="742.0" y="132.0" font-family="Menlo,Consolas,'D2Coding','Apple SD Gothic Neo',monospace" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">0^32</text><text x="824.0" y="132.0" font-family="Menlo,Consolas,'D2Coding','Apple SD Gothic Neo',monospace" font-size="14" fill="#0f172a" font-weight="bold" text-anchor="start">= xS</text><text x="24.0" y="192.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="start">③ AES 3회 (counter 형태)</text><rect x="240.0" y="178.0" width="166.0" height="46.0" rx="8" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="1.6"/><text x="323.0" y="196.7" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">AES(k, xS+1) ⊕ (xS+1)</text><text x="323.0" y="213.7" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">128bit</text><rect x="412.0" y="178.0" width="166.0" height="46.0" rx="8" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="1.6"/><text x="495.0" y="196.7" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">AES(k, xS+2) ⊕ (xS+2)</text><text x="495.0" y="213.7" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">128bit</text><rect x="584.0" y="178.0" width="166.0" height="46.0" rx="8" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed" stroke-width="1.6"/><text x="667.0" y="196.7" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="middle">AES(k, xS+3) ⊕ (xS+3)</text><text x="667.0" y="213.7" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="11" fill="#475569" font-weight="normal" text-anchor="middle">128bit</text><text x="762.0" y="206.0" font-family="Menlo,Consolas,'D2Coding','Apple SD Gothic Neo',monospace" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start">= yS (384bit)</text><rect x="240.0" y="244.0" width="360.0" height="40.0" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-width="1.6"/><text x="420.0" y="268.6" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">④ fS(k, i, j) = yS mod l</text><text x="612.0" y="269.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="start">l : 곡선 base point 의 order</text><rect x="24.0" y="302.0" width="420.0" height="54.0" rx="8" fill="#ea580c" fill-opacity="0.1" stroke="#ea580c" stroke-width="1.6"/><text x="234.0" y="324.6" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">⑤ ACA (공개키 쪽)</text><text x="234.0" y="342.6" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">B(i,j) = A + fS(k,i,j)·G   → cocoon 공개키</text><rect x="456.0" y="302.0" width="420.0" height="54.0" rx="8" fill="#2563eb" fill-opacity="0.1" stroke="#2563eb" stroke-width="1.6"/><text x="666.0" y="324.6" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">⑤ EE (개인키 쪽)</text><text x="666.0" y="342.6" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">b(i,j) = a + fS(k,i,j)   → cocoon 개인키</text><text x="24.0" y="378.0" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#475569" font-weight="normal" text-anchor="start" font-style="italic">EE 는 b(i,j) 를 ECQV 의 kU 자리에 넣어 최종 butterfly 개인키를 복원한다.  (9.3.3.1, 9.3.4, 9.3.5.1)</text></svg>